services:

  postgres:
    image: postgres:17-alpine
    container_name: finsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
    ports:
      - "5432:5432"
    volumes:
      - finsight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U finsight -d finsight"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - finsight

  redis:
    image: redis:8-alpine
    container_name: finsight-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    ports:
      - "6379:6379"
    volumes:
      - finsight_redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - finsight

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: finsight-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: finsight
      RABBITMQ_DEFAULT_PASS: finsight
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - finsight_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - finsight
  
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    container_name: finsight-otel-collector
    restart: unless-stopped
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    networks:
      - finsight

  jaeger:
    image: jaegertracing/all-in-one:1.76
    container_name: finsight-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4319:4317"
    networks:
      - finsight

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: finsight-prometheus
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - finsight_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - finsight

  grafana:
    image: grafana/grafana:12.2.0
    container_name: finsight-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - finsight_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - finsight

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: finsight-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - finsight

networks:
  finsight:
    driver: bridge

volumes:
  finsight_postgres_data:
  finsight_redis_data:
  finsight_rabbitmq_data:
  finsight_prometheus_data:
  finsight_grafana_data:
