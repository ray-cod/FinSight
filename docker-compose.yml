services:

  postgres:
    image: postgres:17-alpine
    container_name: finsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
    ports:
      - "5432:5432"
    volumes:
      - finsight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U finsight -d finsight"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - finsight

  redis:
    image: redis:8-alpine
    container_name: finsight-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    ports:
      - "6379:6379"
    volumes:
      - finsight_redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - finsight

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: finsight-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: finsight
      RABBITMQ_DEFAULT_PASS: finsight
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - finsight_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - finsight

networks:
  finsight:
    driver: bridge

volumes:
  finsight_postgres_data:
  finsight_redis_data:
  finsight_rabbitmq_data: