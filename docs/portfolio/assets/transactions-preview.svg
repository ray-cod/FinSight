pping · Online Shopping · rule classification</text><rect x="280" y="412" width="1054" height="128" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="308" y="448" fill="#64748b" font-family="Arial" font-size="12">Provenance</text><text x="308" y="484" fill="#0f172a" font-family="Arial" font-size="26" font-weight="700">99% confidence</text><text x="308" y="512" fill="#475569" font-family="Arial" font-size="12">Classification source and correction workflow are visible</text><text x="280" y="570" fill="#64748b" font-family="Arial" font-size="12">Representative preview; replace with a captured hosted screenshot for the final portfolio.</text></svg>