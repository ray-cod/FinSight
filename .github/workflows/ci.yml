name: CI

on:
  push:
    branches:
      - dev
      - staging
      - main

  pull_request:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true

      - name: Restore dependencies
        run: dotnet restore FinSight.slnx

      - name: Build
        run: >
          dotnet build FinSight.slnx
          --configuration Release
          --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true

      - name: Restore dependencies
        run: dotnet restore FinSight.slnx

      - name: Test
        run: >
          dotnet test FinSight.slnx
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true

      - name: Restore dependencies
        run: dotnet restore FinSight.slnx

      - name: Check formatting
        run: >
          dotnet format FinSight.slnx
          --verify-no-changes
          --no-restore

  security:
    name: Dependency Security
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true

      - name: Restore dependencies
        run: dotnet restore FinSight.slnx

      - name: Check vulnerable packages
        run: >
          dotnet list FinSight.slnx package
          --vulnerable
          --include-transitive
