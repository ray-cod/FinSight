name: CI

on:
  push:
    branches:
      - dev
      - staging
      - main

  pull_request:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore FinSight.slnx

      - name: Build
        run: >
          dotnet build FinSight.slnx
          --configuration Release
          --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore FinSight.slnx

      - name: Test
        run: >
          dotnet test FinSight.slnx
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore FinSight.slnx

      - name: Check formatting
        run: >
          dotnet format FinSight.slnx
          --verify-no-changes
          --no-restore

  security:
    name: Dependency Security
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore FinSight.slnx

      - name: Check vulnerable packages
        run: >
          dotnet list FinSight.slnx package
          --vulnerable
          --include-transitive

  frontend:
    name: Frontend Quality & E2E
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:5059
      NEXT_PUBLIC_CLIENT_ERROR_ENDPOINT: ""
    defaults:
      run:
        working-directory: frontend/finsight-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/finsight-web/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/finsight-web/pnpm-lock.yaml

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Production E2E tests
        env:
          CI: "1"
          PLAYWRIGHT_USE_PRODUCTION_SERVER: "true"
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            frontend/finsight-web/playwright-report/
            frontend/finsight-web/test-results/
          if-no-files-found: ignore
