name: CD - Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: deployment-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build staging artifact
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore FinSight.slnx

      - name: Publish API
        run: >
          dotnet publish
          src/FinSight.Api/FinSight.Api.csproj
          --configuration Release
          --no-restore
          --output ./artifacts/api

      - name: Publish Workers
        run: >
          dotnet publish
          src/FinSight.Workers/FinSight.Workers.csproj
          --configuration Release
          --no-restore
          --output ./artifacts/workers

      - name: Upload staging artifacts
        uses: actions/upload-artifact@v5
        with:
          name: finsight-staging-${{ github.sha }}
          path: artifacts/
